name: Build and Deploy to Cloudflare

permissions:
    contents: read

concurrency:
    group: ${{ github.repository }}-cloudflare-deploy
    cancel-in-progress: false

on:
    push:
        branches: [main, uat, release*]
    workflow_dispatch:

env:
    D1_DATABASE_NAME: vaultsql
    D1_BINDING: vaultsql
    R2_BUCKET_NAME: warden-send-files
    WORKER_NAME: warden-worker
    WRANGLER_VERSION: 4.111.0
    WORKER_BUILD_VERSION: 0.8.5

jobs:
    deploy:
        name: Provision, Migrate and Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Require Cloudflare API token
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                      echo "::error::Missing required repository secret CLOUDFLARE_API_TOKEN"
                      exit 1
                  fi

            - name: Run deployment helper tests
              run: node --test tests/*.test.mjs

            - name: Install Wrangler
              run: npm install --global "wrangler@${{ env.WRANGLER_VERSION }}"

            - name: Discover account and provision Cloudflare resources
              id: provision
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  WRANGLER_CONFIG: wrangler.jsonc
              run: node scripts/cloudflare-provision.mjs

            - name: Verify database_id was written to Wrangler config
              env:
                  EXPECTED_DATABASE_ID: ${{ steps.provision.outputs.d1_database_id }}
              run: |
                  node --input-type=module -e '
                    import { readFileSync } from "node:fs";
                    import { updateD1DatabaseId } from "./scripts/cloudflare-provision.mjs";
                    const config = readFileSync("wrangler.jsonc", "utf8");
                    const expected = process.env.EXPECTED_DATABASE_ID;
                    if (updateD1DatabaseId(config, "vaultsql", expected) !== config) {
                      throw new Error("wrangler.jsonc does not contain the resolved D1 database_id");
                    }
                  '

            - name: Install Rust toolchain
              run: |
                  rustup set profile minimal
                  rustup toolchain install stable --no-self-update
                  rustup default stable
                  rustup target add wasm32-unknown-unknown
                  rustup component add rustfmt clippy

            - name: Install native build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes lld clang gcc llvm

            - name: Validate Rust project
              run: |
                  cargo fmt --all -- --check
                  cargo test --all-targets
                  cargo clippy --all-targets -- -D warnings

            - name: Install worker-build
              run: cargo install worker-build --version "${{ env.WORKER_BUILD_VERSION }}" --locked

            - name: Validate release Worker build
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: wrangler deploy --dry-run --outdir .wrangler/deploy-check

            - name: Initialize a newly created D1 database
              if: steps.provision.outputs.d1_is_new == 'true'
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  wrangler d1 execute "${{ env.D1_DATABASE_NAME }}" --file=./sql/schema.sql --remote

            - name: Apply pending D1 migrations
              if: ${{ hashFiles('sql/migrations/*.sql') != '' }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  wrangler d1 migrations apply "${{ env.D1_DATABASE_NAME }}" --remote

            - name: Report empty migration directory
              if: ${{ hashFiles('sql/migrations/*.sql') == '' }}
              run: echo "No incremental D1 migrations found in sql/migrations."

            - name: Deploy Worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
              run: wrangler deploy

            - name: Verify deployed health endpoint
              env:
                  WORKER_URL: ${{ steps.provision.outputs.worker_url }}
              run: |
                  for attempt in $(seq 1 12); do
                      if curl --fail --silent --show-error --max-time 10 "$WORKER_URL/alive" > /dev/null; then
                          echo "Health check passed: $WORKER_URL/alive"
                          exit 0
                      fi
                      echo "Health check attempt $attempt/12 failed; retrying in 5 seconds..."
                      sleep 5
                  done
                  echo "::error::Worker health check did not pass after deployment"
                  exit 1

            - name: Write deployment summary
              env:
                  DEPLOYMENT_MODE: ${{ steps.provision.outputs.deployment_mode }}
                  DATABASE_ID: ${{ steps.provision.outputs.d1_database_id }}
                  D1_IS_NEW: ${{ steps.provision.outputs.d1_is_new }}
                  R2_IS_NEW: ${{ steps.provision.outputs.r2_is_new }}
                  WORKER_URL: ${{ steps.provision.outputs.worker_url }}
              run: |
                  {
                      echo "## Cloudflare deployment complete"
                      echo ""
                      echo "- Mode: $DEPLOYMENT_MODE"
                      echo "- Worker: $WORKER_URL"
                      echo "- D1: ${{ env.D1_DATABASE_NAME }} ($DATABASE_ID; new=$D1_IS_NEW)"
                      echo "- R2: ${{ env.R2_BUCKET_NAME }} (new=$R2_IS_NEW)"
                  } >> "$GITHUB_STEP_SUMMARY"
